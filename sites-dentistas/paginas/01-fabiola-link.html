<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dra. Fabíola Rosvita — Links</title>
<style>
/* template de página para dentistas: celular e computador no mesmo arquivo.
   tudo o que muda de cliente para cliente está no bloco CONFIG, dentro do script */
:root{
  --bg:#1A0E14; --surface:#22131B; --raise:#2B1822; --deep:#100810;
  --ink:#F7EDF0; --muted:#C2A3AD; --accent:#EBA0B6; --fill:#B04F6E;
  --glow:rgba(176,79,110,.5); --glow2:rgba(235,160,182,.22); --line:rgba(247,237,240,.14);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --r-arco:999px 999px 24px 24px; --r-grande:28px; --r-banner:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--deep)}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.travado{overflow:hidden}
a{color:inherit}
p{line-height:1.7;color:var(--muted);margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:300;letter-spacing:-.012em;margin:0;line-height:1.1}
.app{position:relative;max-width:560px;margin:0 auto;background:var(--bg);min-height:100svh;overflow:hidden;
  box-shadow:0 0 100px -30px rgba(0,0,0,.85)}
.miolo{width:100%;max-width:1160px;margin:0 auto;padding-inline:20px}
section{padding-block:clamp(36px,9vw,52px)}
.eyebrow{font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

/* espaços de foto de exemplo e fotos reais */
.ph{display:grid;place-items:center;text-align:center;padding:14px;border:1px solid var(--line);
  color:var(--muted);font-size:.7rem;line-height:1.45}
.ph b{display:block;font-family:var(--serif);font-weight:400;font-size:.95rem;color:var(--ink);margin-bottom:3px}
.ph-a{background:radial-gradient(120% 110% at 26% 14%,var(--glow),transparent 62%),linear-gradient(160deg,var(--raise),var(--surface))}
.ph-b{background:radial-gradient(130% 100% at 76% 20%,var(--glow2),transparent 60%),linear-gradient(200deg,var(--surface),var(--raise))}
.ph-c{background:linear-gradient(135deg,var(--raise) 0%,var(--surface) 55%,var(--raise) 100%)}
.ph-d{background:radial-gradient(100% 120% at 50% 100%,var(--glow),transparent 62%),linear-gradient(20deg,var(--surface),var(--raise))}
img.foto{display:block;width:100%;height:100%;object-fit:cover;border:0}

.ap{opacity:0;transform:translateY(20px);transition:opacity 900ms var(--ease),transform 900ms var(--ease)}
.ap.in{opacity:1;transform:none}

/* abertura */
.abertura{position:fixed;inset:0;z-index:300;background:var(--deep);display:grid;place-items:center;
  pointer-events:none;animation:aberturaSai 800ms ease 1500ms forwards}
.abertura-in{text-align:center;animation:aberturaEntra 900ms var(--ease) both}
.abertura .sel{width:78px;height:78px;margin:0 auto;border:1px solid var(--accent);border-radius:14px;
  display:grid;place-items:center;font-family:var(--serif);font-weight:300;font-size:2.1rem;color:var(--accent)}
.abertura small{display:block;margin-top:18px;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
@keyframes aberturaEntra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aberturaSai{to{opacity:0;visibility:hidden}}

/* barra do computador */
.bar{display:none}
.zap{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:60;
  display:inline-flex;align-items:center;gap:10px;height:54px;min-width:54px;padding:0 15px;border-radius:999px;
  justify-content:center;background:var(--fill);color:#fff;text-decoration:none;font-size:.86rem;font-weight:600;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.75);transition:opacity 420ms var(--ease),transform 420ms var(--ease)}
.zap:active{transform:scale(.95)}
.zap.esconde{opacity:0;transform:translateY(12px);pointer-events:none}
.zap svg{width:25px;height:25px;flex:none}
.zap span{display:none}

/* capa */
.capa{position:relative;height:min(100svh,800px);min-height:580px;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;text-align:center;padding:0 24px 40px;isolation:isolate;overflow:hidden}
.capa-foto{position:absolute;inset:0;z-index:-3;border:0;border-radius:0;
  background:radial-gradient(90% 70% at 62% 22%,var(--glow),transparent 62%),
             radial-gradient(70% 60% at 10% 60%,var(--glow2),transparent 62%),var(--surface);
  animation:zoomlento 3000ms var(--ease) 1200ms both}
.capa-foto span{position:absolute;left:0;right:0;top:40%;font-size:.72rem;letter-spacing:.1em;color:rgba(255,255,255,.5)}
.capa::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 38%,var(--bg) 100%)}
@keyframes zoomlento{from{transform:scale(1.12)}to{transform:scale(1)}}
.letras{position:absolute;inset:0;z-index:-2;pointer-events:none}
.letras span{position:absolute;font-family:var(--serif);font-weight:300;line-height:.86;white-space:nowrap;
  color:var(--glow2);opacity:0;animation:letrasEntra 1600ms var(--ease) 1500ms forwards;filter:brightness(1.6)}
.letras .l1{left:-4px;bottom:34%;writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(120px,40vw,190px)}
.letras .l2{right:-6px;top:56px;font-size:clamp(130px,44vw,210px);animation-delay:1700ms}
@keyframes letrasEntra{from{opacity:0;filter:blur(8px) brightness(1.6)}to{opacity:1;filter:brightness(1.6)}}
.capa-info>*{opacity:0;transform:translateY(16px);animation:sobe 1000ms var(--ease) forwards}
.capa-info>:nth-child(1){animation-delay:2000ms}
.capa-info>:nth-child(2){animation-delay:2150ms}
.capa-info>:nth-child(3){animation-delay:2300ms}
.capa-info>:nth-child(4){animation-delay:2450ms}
@keyframes sobe{to{opacity:1;transform:none}}
.selo{width:70px;height:70px;margin:0 auto;border:1px solid rgba(255,255,255,.7);border-radius:14px;
  display:grid;place-items:center;font-family:var(--serif);font-weight:300;font-size:1.9rem;color:#fff}
.capa .nome{margin-top:14px;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.88)}
.capa .arroba{margin-top:6px;font-size:.84rem;color:rgba(255,255,255,.7)}
.capa h1{font-size:clamp(2.8rem,13vw,4.4rem);color:#fff;margin-top:14px}
.capa .esp{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.redes{display:flex;justify-content:center;gap:12px;margin-top:18px}
.redes a{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;
  color:#fff;transition:background 220ms ease,border-color 220ms ease,transform 180ms ease}
.redes a:hover{background:rgba(255,255,255,.14);border-color:#fff}
.redes a:active{transform:scale(.94)}
.redes svg{width:21px;height:21px}
.capa .cargo{margin-top:18px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* capa dividida */
.cv-dividida{height:auto;min-height:0;padding:0;display:block;text-align:left}
.cv-dividida::after{display:none}
.cv-dividida .dv-grid{display:grid;grid-template-columns:1fr;gap:28px;padding-block:34px 20px}
.cv-dividida .dv-foto{aspect-ratio:4/5;border-radius:var(--r-arco);max-height:62svh;width:100%;justify-self:center;
  max-width:420px;position:relative;overflow:hidden;animation:zoomlento 2400ms var(--ease) 1200ms both}
.cv-dividida h1{font-size:clamp(2.6rem,12vw,4.2rem);margin-top:14px}
.cv-dividida .dv-txt{opacity:0;transform:translateY(16px);animation:sobe 1000ms var(--ease) 1900ms forwards}
.cv-dividida .redes{justify-content:flex-start}
.cv-dividida .cargo{color:var(--muted)}
.cv-dividida .esp{color:var(--accent)}
.cv-dividida .ctas{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}
.cv-dividida .redes a{border-color:var(--line);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 26px;border-radius:999px;
  font-size:.9rem;font-weight:600;text-decoration:none;
  transition:transform 180ms ease,background 190ms ease,border-color 190ms ease,color 190ms ease}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--fill);color:#fff}
.btn-solid:hover{filter:brightness(1.12)}
.btn-ghost{border:1px solid rgba(247,237,240,.3);color:var(--ink);background:rgba(255,255,255,.04)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* banners */
.banners{display:grid;gap:16px;grid-template-columns:1fr;padding-block:8px 0}
.banner{position:relative;display:flex;align-items:center;min-height:128px;border-radius:var(--r-banner);overflow:hidden;
  text-decoration:none;border:1px solid var(--line);
  background:radial-gradient(90% 140% at 20% 0%,var(--glow),transparent 60%),
             radial-gradient(70% 120% at 100% 100%,var(--glow2),transparent 60%),var(--surface);
  transition:transform 280ms var(--ease),border-color 220ms ease}
.banner:hover{transform:translateY(-2px);border-color:var(--accent)}
.banner:active{transform:scale(.985)}
.banner::before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.1),transparent);transform:skewX(-14deg);
  animation:brilho 5.5s ease-in-out 3s infinite}
@keyframes brilho{0%,60%{left:-70%}100%{left:130%}}
.banner .foto{flex:0 0 36%;align-self:stretch;border:0;border-radius:0}
.banner .txt{flex:1;padding:16px 18px;line-height:1.05;position:relative;z-index:1}
.banner .txt small{display:block;font-size:.92rem;font-weight:300;color:var(--ink);opacity:.9}
.banner .txt strong{display:block;margin-top:4px;font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(1.9rem,8.4vw,2.35rem);letter-spacing:-.02em;color:#fff}
.banner.inv{flex-direction:row-reverse}
.banner.cheio{min-height:150px}
.banner.cheio .foto{position:absolute;inset:0;flex:none;width:100%;place-items:center end;padding-right:6%}
.banner.cheio .veu{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.1) 75%)}
.banner.cheio .txt{padding:22px}

/* retrato com texto por cima */
.retrato{position:relative;aspect-ratio:3/4;border-radius:var(--r-grande);overflow:hidden;display:flex;align-items:flex-end}
.retrato .foto{position:absolute;inset:0;border:0;border-radius:0;place-items:start center;padding-top:26px}
.retrato::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.4) 45%,rgba(0,0,0,.88) 100%)}
.retrato .conteudo{position:relative;z-index:1;padding:28px 24px 30px;text-align:center}
.retrato h2{font-size:clamp(2.2rem,9.6vw,2.8rem);color:#fff}
.retrato p{margin-top:14px;color:rgba(247,237,240,.9);font-size:.96rem}
.assina{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:12px}
.assina i{width:34px;height:1.5px;background:var(--accent)}
.assina span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#fff}

/* procedimentos */
.proc{padding-inline:0}
.proc .miolo{padding-inline:0}
.cab-trilho{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-inline:20px}
.cab-trilho h2{font-size:clamp(1.9rem,8vw,2.4rem);margin-top:8px}
.setas{display:flex;gap:8px}
.setas button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:1.1rem;transition:border-color 200ms ease,background 200ms ease}
.setas button:hover{border-color:var(--accent);background:rgba(255,255,255,.1)}
.setas button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-inline:20px;margin-top:22px;scroll-padding-inline:20px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.cartao{flex:0 0 72%;scroll-snap-align:start;position:relative;aspect-ratio:4/5;border-radius:var(--r-arco);overflow:hidden;
  border:0;padding:0;cursor:pointer;background:none;text-align:left;color:#fff;transition:transform 320ms var(--ease)}
.cartao:hover{transform:translateY(-3px)}
.cartao:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.cartao .foto{position:absolute;inset:0;border:0;border-radius:0;place-items:start center;padding-top:max(24px,12%)}
.cartao::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85) 100%)}
.cartao .info{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 24px 26px}
.cartao h3{font-size:1.7rem;color:#fff}
.cartao small{display:block;margin-top:6px;font-size:.82rem;color:rgba(247,237,240,.85);line-height:1.45}
.cartao .ver{display:inline-block;margin-top:14px;font-size:.78rem;font-weight:600;letter-spacing:.06em;
  color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:3px}
.trilho::after{content:"";flex:0 0 8px}

/* quem somos: foto grande com uma menor sobreposta, texto e destaques */
.sobre-grid{display:grid;grid-template-columns:1fr;gap:34px;align-items:center}
.sobre-fotos{position:relative;padding-bottom:14%}
.sobre-fotos .g{width:82%;aspect-ratio:4/5;border-radius:var(--r-arco);overflow:hidden}
.sobre-fotos .p{position:absolute;right:0;bottom:0;width:46%;aspect-ratio:1/1;border-radius:var(--r-grande);overflow:hidden;
  border:4px solid var(--bg);box-shadow:0 26px 50px -24px rgba(0,0,0,.7)}
.sobre-fotos .g .foto,.sobre-fotos .p .foto{width:100%;height:100%;border:0;border-radius:0}
.sobre-txt h2{font-size:clamp(1.9rem,8vw,2.6rem);margin-top:8px}
.sobre-txt p{margin-top:16px;font-size:1rem}
.dests{display:grid;gap:16px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.dest b{display:block;font-family:var(--serif);font-weight:400;font-size:1.14rem}
.dest span{display:block;margin-top:3px;font-size:.88rem;color:var(--muted);line-height:1.55}
.sobre-txt .btn{margin-top:28px}

/* dúvidas */
.faq-grid{display:grid;grid-template-columns:1fr;gap:8px}
.faq h2{font-size:clamp(1.9rem,8vw,2.4rem);margin-top:8px}
.faq-lista{border-top:1px solid var(--line);margin-top:22px}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item>button{width:100%;background:none;border:0;padding:20px 40px 20px 0;cursor:pointer;text-align:left;
  position:relative;color:var(--ink);font-family:var(--serif);font-size:1.12rem;font-weight:400;line-height:1.38;transition:color 190ms ease}
.faq-item>button:hover{color:var(--accent)}
.faq-item>button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.faq-item .sinal{position:absolute;right:2px;top:50%;margin-top:-8px;width:16px;height:16px}
.faq-item .sinal::before,.faq-item .sinal::after{content:"";position:absolute;left:0;top:7.5px;width:16px;height:1.4px;
  background:var(--accent);border-radius:2px;transition:transform 340ms var(--ease)}
.faq-item .sinal::after{transform:rotate(90deg)}
.faq-item.aberto .sinal::after{transform:rotate(0)}
.faq-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows 360ms var(--ease)}
.faq-item.aberto .faq-corpo{grid-template-rows:1fr}
.faq-dentro{overflow:hidden;min-height:0}
.faq-dentro p{padding-bottom:20px;font-size:.94rem}
.conv{margin-top:26px}
.conv .rot{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{font-size:.8rem;padding:8px 15px;border-radius:999px;background:var(--glow2);border:1px solid var(--line)}
.conv small{display:block;margin-top:12px;font-size:.76rem;color:var(--muted);line-height:1.6}

/* onde estamos */
.local-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);display:grid;grid-template-columns:1fr}
.mapa{aspect-ratio:16/9;display:grid;place-items:center;border:0;border-radius:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 25px,rgba(255,255,255,.07) 26px),
             repeating-linear-gradient(90deg,transparent,transparent 25px,rgba(255,255,255,.07) 26px),var(--raise)}
.mapa .pino{width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);
  box-shadow:0 10px 20px -6px rgba(0,0,0,.6)}
.local-info{padding:22px 22px 24px}
.local-info h2{font-size:clamp(1.8rem,7.6vw,2.2rem)}
.local-info dl{display:grid;gap:15px;margin:18px 0 0}
.local-info dt{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.local-info dd{margin:4px 0 0;font-family:var(--serif);font-size:1.08rem}
.local-info .btn{margin-top:22px;width:100%}

/* posts */
.posts .rot{text-align:center;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.ig{margin:18px auto 0;max-width:520px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.ig-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ig-top .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--fill),var(--raise));color:#fff;font-family:var(--serif);font-size:1rem}
.ig-top .quem{flex:1;min-width:0}
.ig-top b{display:block;font-size:.9rem;font-weight:600}
.ig-top .sub{font-size:.76rem;color:var(--muted)}
.ig-top a{font-size:.8rem;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--fill);color:#fff;text-decoration:none;white-space:nowrap}
.ig-post{aspect-ratio:1/1;border:0;border-radius:0}
.ig-foot{padding:14px 16px;text-align:center}
.ig-foot a{color:var(--accent);font-weight:600;font-size:.86rem;text-decoration:none}

footer{padding:30px 20px calc(96px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.74rem;color:var(--muted);
  border-top:1px solid var(--line);display:grid;gap:7px}
footer .cro{color:var(--ink);font-weight:500}
footer .nota{opacity:.8;line-height:1.55}

/* visualizador */
.lb{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:rgba(0,0,0,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F7EDF0;opacity:0;transition:opacity 200ms ease}
.lb.on{display:flex}
.lb.vis{opacity:1}
.lb-topo{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}
.lb-topo .tit{font-family:var(--serif);font-size:1.1rem}
.lb-topo .conta{font-size:.76rem;letter-spacing:.1em;opacity:.65;margin-top:2px}
.lb button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#F7EDF0;width:42px;height:42px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:1.1rem;flex:none;transition:background 200ms ease,transform 160ms ease}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb button:active{transform:scale(.94)}
.lb button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.lb-palco{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding-inline:16px;touch-action:pan-y}
.lb-palco figure{margin:0;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;will-change:transform}
.lb-palco .ph,.lb-palco img{aspect-ratio:4/5;border-radius:14px;width:100%;object-fit:cover}
.lb-legenda{text-align:center;font-size:.84rem;opacity:.78;line-height:1.5}
.lb .lb-seta{position:absolute;top:50%;margin-top:-21px}
.lb-ant{left:clamp(6px,2vw,24px)} .lb-prox{right:clamp(6px,2vw,24px)}
@media(max-width:899px){.lb .lb-seta{display:none}}
.lb-rodape{flex:none;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.lb-rodape .pt{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);padding:0;border:0;min-width:0;
  transition:transform 260ms var(--ease),background 260ms ease}
.lb-rodape .pt.sel{background:var(--accent);transform:scale(1.5)}
.lb-dica{text-align:center;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;opacity:.4;padding-bottom:4px}
@media(min-width:900px){.lb-dica{display:none}.lb-palco figure{max-width:520px}}

/* ============ efeitos do link da bio (ligados por CONFIG.efeitos) ============ */
.capa-media{position:absolute;inset:0;z-index:-3}
.capa-media .capa-foto{z-index:0}
.capa-veu,.decor{display:none}
.efeitos .capa-veu{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,var(--bg) 88%);opacity:0}
.efeitos .capa-info{position:relative;z-index:2}
.efeitos .decor{display:block;position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.decor i{position:absolute;display:block;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
  clip-path:inset(0 100% 0 0);animation:desenha 1500ms var(--ease) forwards}
.decor .fa{left:-1px;top:8%;width:46%;height:30%;border-left:0;animation-delay:2300ms}
.decor .fb{right:9%;top:35%;width:33%;aspect-ratio:1/1;border-color:color-mix(in srgb,var(--accent) 26%,transparent);animation-delay:2600ms}
.decor .fc{left:15%;bottom:31%;width:24%;height:13%;border-color:color-mix(in srgb,var(--accent) 22%,transparent);animation-delay:2900ms}
.decor .la{left:0;right:0;top:23%;height:0;border-width:1px 0 0;
  border-image:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 45%,transparent) 35%,transparent) 1;animation-delay:2100ms}
.decor .lb2{left:63%;top:0;bottom:44%;width:0;border-width:0 0 0 1px;
  border-image:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 40%,transparent) 40%,transparent) 1;
  clip-path:inset(0 0 100% 0);animation-name:desenhaV;animation-delay:2450ms}
@keyframes desenha{to{clip-path:inset(0 0 0 0)}}
@keyframes desenhaV{to{clip-path:inset(0 0 0 0)}}
.efeitos .capa .nome{display:flex;align-items:center;justify-content:center;gap:14px}
.efeitos .capa .nome::before,.efeitos .capa .nome::after{content:"";width:34px;height:1px;flex:none}
.efeitos .capa .nome::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75))}
.efeitos .capa .nome::after{background:linear-gradient(270deg,transparent,rgba(255,255,255,.75))}
.efeitos .eyebrow::before{content:"";display:inline-block;width:26px;height:1px;background:var(--accent);vertical-align:middle;margin-right:10px}
.efeitos .cab-trilho h2::after,.efeitos .faq h2::after,.efeitos .local-info h2::after,.efeitos .passa-tit::after{
  content:"";display:block;width:72px;height:1px;margin-top:16px;background:linear-gradient(90deg,var(--accent),transparent)}
.efeitos .retrato h2::after{content:"";display:block;width:86px;height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,var(--accent),transparent)}

/* ao rolar, a capa se dissolve no fundo (só onde o navegador suporta linha do tempo de rolagem) */
@supports (animation-timeline:view()){
  .efeitos .capa-media{animation:capaMidia linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
  .efeitos .letras{animation:capaLetras linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
  .efeitos .decor{animation:capaDecor linear both;animation-timeline:view();animation-range:exit 0% exit 70%}
  .efeitos .capa-info{animation:capaInfo linear both;animation-timeline:view();animation-range:exit 0% exit 75%}
  .efeitos .capa-veu{animation:capaVeu linear both;animation-timeline:view();animation-range:exit 5% exit 100%}
  @keyframes capaMidia{to{transform:translateY(14%) scale(1.07)}}
  @keyframes capaLetras{to{transform:translateY(-14%);opacity:.12}}
  @keyframes capaDecor{to{opacity:0;transform:translateY(-24px)}}
  @keyframes capaInfo{to{transform:translateY(-36px);opacity:0}}
  @keyframes capaVeu{to{opacity:1}}
}

/* banners em que a pessoa sai para fora do cartão */
.banners.recorte-grade{gap:46px}
.banner.recorte{overflow:visible;border:0;background:none;min-height:132px;margin-top:34px}
.banner.recorte .fundo{position:absolute;inset:0;border-radius:var(--r-banner);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(90% 140% at 20% 0%,var(--glow),transparent 60%),
             radial-gradient(70% 120% at 100% 100%,var(--glow2),transparent 60%),var(--surface)}
.banner.recorte .fundo::before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.1),transparent);transform:skewX(-14deg);
  animation:brilho 5.5s ease-in-out 3s infinite}
.banner.recorte::before{display:none}
.banner.recorte .pessoa{position:absolute;left:8px;bottom:0;width:36%;height:calc(100% + 34px);z-index:1;pointer-events:none}
.banner.recorte.inv .pessoa{left:auto;right:8px}
.banner.recorte .pessoa img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.banner.recorte .pessoa .sil{position:absolute;inset:0}
.banner.recorte .pessoa .sil::before{content:"";position:absolute;left:50%;top:4%;width:46%;aspect-ratio:1/1;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 35% 30%,var(--accent),var(--fill))}
.banner.recorte .pessoa .sil::after{content:"";position:absolute;left:3%;right:3%;bottom:0;height:50%;border-radius:50% 50% 0 0/62% 62% 0 0;
  background:linear-gradient(180deg,var(--fill),var(--raise))}
.banner.recorte .pessoa small{position:absolute;left:0;right:0;bottom:8px;z-index:2;text-align:center;font-size:.6rem;letter-spacing:.06em;color:#fff;opacity:.85}
.banner.recorte .txt{padding-left:calc(36% + 16px);padding-right:16px}
.banner.recorte.inv .txt{padding-left:18px;padding-right:calc(36% + 16px)}

/* fotos que passam sozinhas */
.passa{padding-inline:0}
.passa-tit{font-size:clamp(1.9rem,8vw,2.4rem);margin-top:8px}
.passa-cab{padding-inline:20px;margin-bottom:22px}
.passa-trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-inline:20px;scroll-padding-inline:20px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.passa-trilho::-webkit-scrollbar{display:none}
.slide{flex:0 0 62%;scroll-snap-align:center;margin:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.slide small{display:block;margin-top:10px;font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.slide .foto{display:grid;width:100%;aspect-ratio:4/5;border-radius:var(--r-banner);overflow:hidden}
.passa-pontos{display:flex;justify-content:center;gap:8px;margin-top:18px}
.passa-pontos i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:transform 300ms var(--ease),background 300ms ease}
.passa-pontos i.sel{background:var(--accent);transform:scale(1.5)}
.ig-post{aspect-ratio:4/5;display:block}
.ig-post .foto{width:100%;height:100%;border:0;border-radius:0}

@media(prefers-reduced-motion:reduce){
  .decor i{animation:none;clip-path:none}
  .efeitos .capa-media,.efeitos .letras,.efeitos .decor,.efeitos .capa-info,.efeitos .capa-veu{animation:none}
}

/* ============ variações de estrutura ============ */
.mov-fade .ap{transform:none;transition-duration:1200ms}
.mov-lateral .ap{transform:translateX(-30px)}
.mov-lateral .ap.in{transform:none}

/* capa editorial */
.cv-editorial{height:auto;min-height:92svh;align-items:stretch;justify-content:flex-end;text-align:left;padding:0}
.cv-editorial::after{background:linear-gradient(90deg,rgba(0,0,0,.74) 0%,rgba(0,0,0,.22) 72%),linear-gradient(180deg,transparent 55%,var(--bg) 100%)}
.cv-editorial .ed-grid{position:relative;z-index:2;padding-block:120px 54px}
.cv-editorial .ed-txt>*{opacity:0;transform:translateY(16px);animation:sobe 1000ms var(--ease) forwards}
.cv-editorial .ed-txt>:nth-child(1){animation-delay:1900ms}
.cv-editorial .ed-txt>:nth-child(2){animation-delay:2050ms}
.cv-editorial .ed-txt>:nth-child(3){animation-delay:2200ms}
.cv-editorial .ed-txt>:nth-child(4){animation-delay:2350ms}
.cv-editorial h1{font-size:clamp(3rem,13vw,6.8rem);color:#fff;line-height:.98;margin-top:14px;letter-spacing:-.02em}
.cv-editorial h1 em{display:block;font-style:italic;color:var(--accent)}
.cv-editorial .esp{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cv-editorial .cargo{margin-top:18px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cv-editorial .ctas{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
.ed-lado{display:none}

/* quem somos: livre (foto retangular com moldura deslocada) e faixa (foto larga no topo) */
.sb-livre .sbl-grid{display:grid;grid-template-columns:1fr;gap:34px}
.sb-livre .sbl-foto{margin:0;padding:0 16px 16px 0;isolation:isolate}
.sb-livre .moldura{position:relative;aspect-ratio:4/5;border-radius:var(--r-grande)}
.sb-livre .moldura .foto{width:100%;height:100%;border-radius:inherit}
.sb-livre .moldura::after{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  border-radius:var(--r-grande);z-index:-1;pointer-events:none}
.sb-livre h2,.sb-faixa h2{font-size:clamp(1.9rem,8vw,2.6rem);margin-top:8px}
.sb-livre .sbl-txt p{margin-top:16px;font-size:1rem}
.sb-livre .dests{margin-top:44px}
.sb-livre .btn{margin-top:30px}
.sb-faixa .sbf-foto{aspect-ratio:3/2;border-radius:var(--r-grande);overflow:hidden}
.sb-faixa .sbf-foto .foto{width:100%;height:100%;border:0;border-radius:0}
.sb-faixa .sbf-cols{display:grid;grid-template-columns:1fr;gap:18px;margin-top:34px}
.sb-faixa .sbf-textos p{margin-top:0;font-size:1rem}
.sb-faixa .sbf-textos p+p{margin-top:16px}
.sb-faixa .dests{margin-top:34px}
.sb-faixa .btn{margin-top:30px}

/* procedimentos: destaque (um grande e outros menores) e lista editorial */
.trilho.destaque{display:grid;grid-template-columns:1fr;gap:14px;overflow:visible;padding-inline:20px;margin-top:22px;scroll-snap-type:none}
.trilho.destaque .cartao{flex:none;aspect-ratio:16/11}
.lista-ed{margin:26px 20px 0;border-top:1px solid var(--line)}
.lista-ed .linha{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"nome mini" "resumo mini";gap:6px 18px;
  align-items:center;padding:22px 0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;
  transition:padding 300ms var(--ease)}
.lista-ed .linha .nome{grid-area:nome;font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.4rem);font-weight:400;line-height:1.1;transition:color 220ms ease}
.lista-ed .linha .resumo{grid-area:resumo;font-size:.9rem;color:var(--muted);line-height:1.55;max-width:48ch}
.lista-ed .linha .mini{grid-area:mini;display:block;width:84px;height:84px;border-radius:var(--r-banner);overflow:hidden}
.lista-ed .linha .mini .foto{width:100%;height:100%;border:0;border-radius:0;font-size:0}
.lista-ed .linha .mini .foto *{display:none}
.lista-ed .linha:hover .nome{color:var(--accent)}
.lista-ed .linha:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* dúvidas centralizadas */
.faq-colcentro{max-width:820px;margin-inline:auto}
.faq-colcentro .faq-topo{text-align:center}
.faq-colcentro .faq-topo h2{margin-inline:auto}
.faq-colcentro .faq-lista{margin-top:30px}
.faq-colcentro .conv{text-align:center}
.faq-colcentro .chips{justify-content:center}

/* localização em faixa: mapa largo com cartão sobreposto */
.local-faixa{padding:0 0 60px}
.local-faixa .mapa-largo{height:240px;border-block:1px solid var(--line);display:grid;place-items:center;
  background:repeating-linear-gradient(0deg,transparent,transparent 25px,rgba(255,255,255,.07) 26px),
             repeating-linear-gradient(90deg,transparent,transparent 25px,rgba(255,255,255,.07) 26px),var(--raise)}
.local-faixa .mapa-largo .pino{width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);box-shadow:0 10px 20px -6px rgba(0,0,0,.6)}
.local-faixa .local-flut{position:relative;z-index:2;margin:-70px 20px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-grande);padding:28px 24px 30px}
.local-faixa .local-flut h2{font-size:clamp(1.8rem,7.6vw,2.2rem)}

  var PROCS={}; C.procedimentos.forEach(function(p){PROCS[p.id]=p;});
  var lb=document.getElementById('lb'), lbFig=document.getElementById('lbFig'), lbMidia=document.getElementById('lbMidia'),
      lbLegenda=document.getElementById('lbLegenda'), lbConta=document.getElementById('lbConta'),
      lbTit=document.getElementById('lbTit'), lbPontos=document.getElementById('lbPontos'), lbPalco=document.getElementById('lbPalco');
  var atual=null, idx=0, focoAnterior=null;
  function pintar(){
    var f=atual.fotos[idx];
    lbMidia.innerHTML=f.src?'<img src="'+h(f.src)+'" alt="'+h(f.leg||atual.nome)+'">'
      :'<div class="ph '+CORES[idx%4]+'"><div><b>'+h(f.t)+'</b>'+h(f.leg)+'</div></div>';
    lbLegenda.textContent=f.leg||''; lbTit.textContent=atual.nome; lbConta.textContent=(idx+1)+' de '+atual.fotos.length;
    lbPontos.textContent='';
    atual.fotos.forEach(function(_,k){
      var p=document.createElement('button'); p.type='button'; p.className='pt'+(k===idx?' sel':'');
      p.setAttribute('aria-label','Foto '+(k+1)); p.addEventListener('click',function(){idx=k;pintar();}); lbPontos.appendChild(p);
    });
  }
  function abrir(id,inicio){
    atual=PROCS[id]; if(!atual||!atual.fotos||!atual.fotos.length) return;
    idx=inicio||0; focoAnterior=document.activeElement; pintar(); lb.classList.add('on');
    setTimeout(function(){lb.classList.add('vis');},20);
    document.body.classList.add('travado'); document.getElementById('lbFechar').focus();
  }
  function fechar(){
    lb.classList.remove('vis');
    setTimeout(function(){lb.classList.remove('on');document.body.classList.remove('travado');
      if(focoAnterior&&focoAnterior.focus) focoAnterior.focus();},190);
  }
  function passar(d){idx=(idx+d+atual.fotos.length)%atual.fotos.length;pintar();}
  document.querySelectorAll('[data-proc]').forEach(function(el){el.addEventListener('click',function(){abrir(el.dataset.proc,parseInt(el.dataset.idx||'0',10));});});
  document.getElementById('lbFechar').addEventListener('click',fechar);
  document.getElementById('lbAnt').addEventListener('click',function(){passar(-1);});
  document.getElementById('lbProx').addEventListener('click',function(){passar(1);});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') fechar(); if(e.key==='ArrowLeft') passar(-1); if(e.key==='ArrowRight') passar(1);
  });
  var x0=0,y0=0,dx=0,dy=0,eixo=null,arrastando=false;
  lbPalco.addEventListener('pointerdown',function(e){
    if(e.target.closest('.lb-seta')) return;
    arrastando=true;eixo=null;dx=dy=0;x0=e.clientX;y0=e.clientY;lbFig.style.transition='none';
    try{lbPalco.setPointerCapture(e.pointerId);}catch(err){}
  });
  lbPalco.addEventListener('pointermove',function(e){
    if(!arrastando) return;
    dx=e.clientX-x0;dy=e.clientY-y0; if(!eixo) eixo=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(eixo==='x'){lbFig.style.transform='translateX('+dx+'px)';lbFig.style.opacity=String(Math.max(.45,1-Math.abs(dx)/600));}
    else if(dy>0){lbFig.style.transform='translateY('+dy+'px)';lbFig.style.opacity=String(Math.max(0,1-dy/420));}
  });
  function soltar(){
    if(!arrastando) return; arrastando=false;
    lbFig.style.transition='transform 260ms var(--ease), opacity 260ms var(--ease)';
    lbFig.style.transform='';lbFig.style.opacity='';
    var larg=lbPalco.getBoundingClientRect().width;
    if(eixo==='y'&&dy>120){fechar();return;}
    if(eixo==='x'){ if(dx<-larg*.18) passar(1); else if(dx>larg*.18) passar(-1); }
  }
  lbPalco.addEventListener('pointerup',soltar); lbPalco.addEventListener('pointercancel',soltar);

  /* ---------- carrossel, dúvidas, barra, botão flutuante ---------- */
  var trilho=document.getElementById('trilho');
  if(trilho){
    var passo=function(){var c=trilho.querySelector('.cartao');return c?c.getBoundingClientRect().width+12:280;};
    var ant=document.getElementById('trAnt'), prox=document.getElementById('trProx');
    ant.addEventListener('click',function(){trilho.scrollBy({left:-passo(),behavior:semMov?'auto':'smooth'});});
    prox.addEventListener('click',function(){trilho.scrollBy({left:passo(),behavior:semMov?'auto':'smooth'});});
  }
  document.querySelectorAll('.faq-item').forEach(function(item){
    var b=item.querySelector('button');
    b.addEventListener('click',function(){var a=!item.classList.contains('aberto');item.classList.toggle('aberto',a);b.setAttribute('aria-expanded',a?'true':'false');});
  });
  var bar=document.getElementById('bar'), zapEl=document.getElementById('zap');
  function estado(){
    bar.classList.toggle('topo',window.scrollY<60);
    zapEl.classList.toggle('esconde',window.scrollY<window.innerHeight*.7);
  }
  window.addEventListener('scroll',estado,{passive:true}); estado();

  /* fotos que passam sozinhas, de dois em dois segundos */
  var passaT=document.getElementById('passaTrilho');
  if(passaT){
    var slidesP=passaT.querySelectorAll('.slide'), pontosP=document.querySelectorAll('#passaPontos i');
    var ip=0, pausadoAte=0, visivelP=false;
    var irPara=function(i){
      var s=slidesP[i];
      passaT.scrollTo({left:s.offsetLeft-(passaT.clientWidth-s.clientWidth)/2,behavior:semMov?'auto':'smooth'});
    };
    passaT.addEventListener('scroll',function(){
      var meio=passaT.scrollLeft+passaT.clientWidth/2, melhor=0, dist=1e9;
      slidesP.forEach(function(s,k){var d=Math.abs(s.offsetLeft+s.clientWidth/2-meio);if(d<dist){dist=d;melhor=k;}});
      ip=melhor; pontosP.forEach(function(p,k){p.classList.toggle('sel',k===melhor);});
    },{passive:true});
    ['pointerdown','touchstart','wheel'].forEach(function(ev){
      passaT.addEventListener(ev,function(){pausadoAte=Date.now()+6000;},{passive:true});
    });
    if(!semMov){
      if('IntersectionObserver' in window){
        new IntersectionObserver(function(es){visivelP=es[0].isIntersecting;},{threshold:.35}).observe(passaT);
      } else { visivelP=true; }
      setInterval(function(){
        if(!visivelP||document.hidden||Date.now()<pausadoAte) return;
        irPara((ip+1)%slidesP.length);
      },2000);
    }
  }

  var alvos=document.querySelectorAll('.ap');
  if('IntersectionObserver' in window && !semMov){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},
      {rootMargin:'0px 0px -6% 0px',threshold:.05});
    alvos.forEach(function(el){io.observe(el);});
  } else { alvos.forEach(function(el){el.classList.add('in');}); }
})();
</script>

</body></html>
